<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --tabbar: #dee1e6;
    --text: #202124;
    --text-dim: #5f6368;
    --border: #dadce0;
    --accent: #1a73e8;
    --hover: #e8eaed;
    --danger: #d93025;
  }
  body.dark {
    --bg: #232427;
    --tabbar: #17181a;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --border: #3c4043;
    --accent: #8ab4f8;
    --hover: #3c4043;
    --danger: #f28b82;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 12px;
    -webkit-user-select: none;
    user-select: none;
    color: var(--text);
  }

  #chrome { position: fixed; top: 0; left: 0; right: 0; }

  /* =============== tab row (top) =============== */
  #tabRow {
    height: 36px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 6px 6px 0;
    background: var(--tabbar);
    box-sizing: border-box;
    cursor: default;
  }

  #logo {
    width: 14px; height: 14px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--accent); border-bottom-color: transparent;
    transform: rotate(-45deg); margin: 0 4px 6px 6px;
    transition: transform .4s ease;
  }
  #logo.spin { transform: rotate(315deg); }

  #tabstrip {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    height: 30px;
    scrollbar-width: none;
  }
  #tabstrip::-webkit-scrollbar { display: none; }

  .tab {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    max-width: 150px;
    min-width: 64px;
    transition: background-color .12s ease, color .12s ease;
  }
  .tab:hover:not(.active) { background: rgba(0,0,0,0.06); }
  body.dark .tab:hover:not(.active) { background: rgba(255,255,255,0.08); }
  .tab.active { background: var(--bg); color: var(--text); }
  .tab.pinned { min-width: 32px; max-width: 32px; padding: 0; justify-content: center; }
  .tab.tab-dragging { opacity: 0.5; cursor: grabbing; }
  .tab .tab-monogram {
    display: none;
    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;
    align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color: #fff;
  }
  .tab.pinned .tab-monogram { display: flex; }
  .tab .tab-favicon { display: none; width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; }
  .tab.has-favicon:not(.loading) .tab-favicon { display: block; }
  .tab.has-favicon.pinned:not(.loading) .tab-monogram { display: none; }
  .tab .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; pointer-events: none; font-size: 12px; }
  .tab.pinned .tab-title, .tab.pinned .tab-close { display: none; }
  .tab .tab-spinner {
    display: none;
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); border-top-color: var(--accent);
    animation: spin .6s linear infinite;
  }
  .tab.loading .tab-spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab .tab-mute {
    display: none;
    font-size: 11px; flex-shrink: 0; color: var(--accent); cursor: pointer;
    width: 14px; text-align: center; border-radius: 3px;
  }
  .tab.audible .tab-mute, .tab.muted .tab-mute { display: inline-block; }
  .tab.muted .tab-mute { color: var(--text-dim); }
  .tab .tab-mute:hover { background: rgba(0,0,0,0.08); }
  body.dark .tab .tab-mute:hover { background: rgba(255,255,255,0.12); }
  .tab.pinned .tab-mute { position: absolute; bottom: 1px; right: 1px; font-size: 8px; width: auto; }
  /* A discarded (Memory Saver) tab is unchanged visually except a slightly
     dimmed title — it's still a real tab, just not currently running. */
  .tab.discarded .tab-title { opacity: 0.65; }
  .tab .tab-close {
    width: 16px; height: 16px; line-height: 16px; text-align: center;
    border-radius: 3px; color: inherit; opacity: 0.55; flex-shrink: 0; font-size: 13px;
    transition: background-color .1s ease, opacity .1s ease;
  }
  .tab .tab-close:hover { opacity: 1; background: rgba(0,0,0,0.1); }
  body.dark .tab .tab-close:hover { background: rgba(255,255,255,0.14); }

  #newTabBtn {
    width: 26px; height: 26px; flex-shrink: 0; border: none; border-radius: 50%;
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 15px;
    line-height: 1; margin-bottom: 3px; transition: background-color .12s ease, transform .1s ease;
  }
  #newTabBtn:hover { background: rgba(0,0,0,0.08); }
  body.dark #newTabBtn:hover { background: rgba(255,255,255,0.1); }
  #newTabBtn:active { transform: scale(0.88); }

  #winctrls { display: flex; align-items: center; gap: 0; flex-shrink: 0; align-self: flex-start; }
  #winctrls button {
    width: 32px; height: 30px; border: none; background: transparent; color: var(--text-dim);
    cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
    transition: background-color .12s ease;
  }
  #winctrls button:hover { background: rgba(0,0,0,0.08); }
  body.dark #winctrls button:hover { background: rgba(255,255,255,0.1); }
  #closeWinBtn:hover { background: #e81123 !important; color: #fff; }

  /* =============== nav row (address bar) =============== */
  #navRow {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    box-sizing: border-box;
    position: relative;
  }

  #loadBar {
    position: absolute; left: 0; bottom: -1px; height: 2px; width: 0;
    background: var(--accent); opacity: 0; transition: opacity .15s ease;
  }
  #loadBar.active { opacity: 1; animation: loadSweep 1.1s ease-in-out infinite; }
  @keyframes loadSweep { 0% { width: 0%; margin-left: 0%; } 50% { width: 60%; margin-left: 20%; } 100% { width: 0%; margin-left: 100%; } }

  #navbtns { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
  #navbtns button, #starBtn, #menuBtn {
    width: 28px; height: 28px; border: none; border-radius: 50%; background: transparent;
    color: var(--text-dim); cursor: pointer; font-size: 14px; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
    transition: background-color .12s ease, color .12s ease, transform .1s ease;
  }
  #navbtns button:hover:not(:disabled), #starBtn:hover, #menuBtn:hover { background: var(--hover); }
  #navbtns button:active:not(:disabled), #starBtn:active, #menuBtn:active { transform: scale(0.88); }
  #navbtns button:disabled { opacity: 0.3; cursor: default; }
  #starBtn.active { color: var(--accent); animation: starPop .25s ease; }
  @keyframes starPop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  #urlbarWrap {
    flex: 1; min-width: 0; height: 30px; display: flex; align-items: center;
    border: 1px solid var(--border); border-radius: 15px; background: var(--bg);
    padding: 0 4px 0 12px; transition: border-color .12s ease, box-shadow .12s ease;
  }
  #urlbarWrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
  #urlbar { flex: 1; min-width: 0; height: 100%; border: none; background: transparent; color: var(--text); outline: none; font-size: 12.5px; }
  .lock { color: var(--text-dim); font-size: 11px; margin-right: 4px; flex-shrink: 0; }

  /* =============== bookmarks bar =============== */
  #bookmarksBar {
    height: 32px; display: none; align-items: center; gap: 4px; padding: 0 10px;
    background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto;
  }
  #bookmarksBar.show { display: flex; }
  #bookmarksBar::-webkit-scrollbar { display: none; }
  .bm-chip {
    display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; color: var(--text); cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: background-color .1s ease;
  }
  .bm-chip:hover { background: var(--hover); }
  .bm-chip-icon { width: 13px; height: 13px; border-radius: 2px; flex-shrink: 0; }
  .bm-empty { font-size: 11px; color: var(--text-dim); padding: 0 4px; }

  /* =============== find bar =============== */
  #findBar {
    position: fixed; top: 44px; right: 16px; z-index: 9998;
    display: none; align-items: center; gap: 4px; padding: 6px 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(-6px) scale(.98);
    transition: opacity .12s ease, transform .12s ease;
  }
  #findBar.show { display: flex; opacity: 1; transform: none; }
  #findBar input { border: none; outline: none; background: transparent; color: var(--text); font-size: 12px; width: 160px; }
  #findBar .find-count { font-size: 11px; color: var(--text-dim); min-width: 46px; text-align: center; flex-shrink: 0; }
  #findBar button {
    width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent;
    color: var(--text-dim); cursor: pointer; font-size: 12px; flex-shrink: 0;
    transition: background-color .1s ease;
  }
  #findBar button:hover { background: var(--hover); }

  /* =============== floating menus =============== */
  .floating-menu {
    position: fixed; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.22); min-width: 220px; z-index: 9999;
    padding: 8px; opacity: 0; transform: translateY(-6px) scale(.98); pointer-events: none;
    transition: opacity .12s ease, transform .12s ease;
  }
  .floating-menu.show { opacity: 1; transform: none; pointer-events: auto; }
  .menu-item {
    padding: 7px 8px; font-size: 12.5px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    border-radius: 7px; transition: background-color .1s ease;
  }
  .menu-item:hover { background: var(--hover); }
  .menu-item.danger { color: var(--danger); }
  .menu-item .mi-icon {
    width: 16px; height: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
  }
  .menu-item .mi-icon svg { width: 16px; height: 16px; display: block; }
  .menu-item.danger .mi-icon { color: var(--danger); }
  .menu-item .mi-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item .mi-shortcut { color: var(--text-dim); font-size: 10.5px; flex-shrink: 0; }
  .menu-divider { height: 1px; background: var(--border); margin: 6px 4px; }
</style>
</head>
<body>
  <div id="chrome">
    <div id="tabRow">
      <div id="logo" title="Daybreak"></div>
      <div id="tabstrip"></div>
      <button id="newTabBtn" title="New tab">+</button>
      <div id="winctrls">
        <button id="minBtn" title="Minimize">&#8212;</button>
        <button id="maxBtn" title="Maximize">&#9723;</button>
        <button id="closeWinBtn" title="Close">&#10005;</button>
      </div>
    </div>

    <div id="navRow">
      <div id="loadBar"></div>
      <div id="navbtns">
        <button id="backBtn" title="Back">&#8592;</button>
        <button id="fwdBtn" title="Forward">&#8594;</button>
        <button id="reloadBtn" title="Reload">&#8635;</button>
      </div>
      <div id="urlbarWrap">
        <input id="urlbar" type="text" spellcheck="false" placeholder="Search or enter address">
      </div>
      <button id="starBtn" title="Bookmark this page (Ctrl+D)">&#9733;</button>
      <button id="menuBtn" title="Menu">&#8942;</button>
    </div>

    <div id="bookmarksBar"></div>
  </div>

  <div id="findBar">
    <input id="findInput" type="text" placeholder="Find in page">
    <span class="find-count" id="findCount"></span>
    <button id="findPrev" title="Previous">&#8593;</button>
    <button id="findNext" title="Next">&#8595;</button>
    <button id="findClose" title="Close">&#10005;</button>
  </div>

  <div id="menuDropdown" class="floating-menu">
    <div class="menu-item" id="menuNewTab"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span><span class="mi-label">New tab</span><span class="mi-shortcut">Ctrl+T</span></div>
    <div class="menu-item" id="menuReopen"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 2.6 5.9"/><polyline points="4 5 4 10 9 10"/></svg></span><span class="mi-label">Reopen closed tab</span><span class="mi-shortcut">Ctrl+Shift+T</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuBookmarks"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><polygon points="12 3 14.9 9.3 21.8 10 16.5 14.6 18 21.4 12 17.8 6 21.4 7.5 14.6 2.2 10 9.1 9.3"/></svg></span><span class="mi-label">Bookmarks</span></div>
    <div class="menu-item" id="menuHistory"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><polyline points="12 7.5 12 12 15.5 14"/></svg></span><span class="mi-label">History</span></div>
    <div class="menu-item" id="menuDownloads"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><polyline points="7.5 10 12 14.5 16.5 10"/><path d="M5 19h14"/></svg></span><span class="mi-label">Downloads</span></div>
    <div class="menu-item" id="menuApps"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.2"/></svg></span><span class="mi-label">Apps</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuFind"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.3" y2="15.3"/></svg></span><span class="mi-label">Find in page</span><span class="mi-shortcut">Ctrl+F</span></div>
    <div class="menu-item" id="menuViewSource"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="8.5 8 4 12 8.5 16"/><polyline points="15.5 8 20 12 15.5 16"/></svg></span><span class="mi-label">View page source</span><span class="mi-shortcut">Ctrl+U</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuZoomOut"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><line x1="7.5" y1="11" x2="14.5" y2="11"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg></span><span class="mi-label">Zoom out</span><span class="mi-shortcut">Ctrl+-</span></div>
    <div class="menu-item" id="menuZoomReset"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="12" r="8.5"/></svg></span><span class="mi-label">Reset zoom</span><span class="mi-shortcut">Ctrl+0</span></div>
    <div class="menu-item" id="menuZoomIn"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><line x1="11" y1="7.5" x2="11" y2="14.5"/><line x1="7.5" y1="11" x2="14.5" y2="11"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg></span><span class="mi-label">Zoom in</span><span class="mi-shortcut">Ctrl++</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuSettings"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="11" cy="17" r="2"/></svg></span><span class="mi-label">Settings</span></div>
    <div class="menu-item" id="menuToggleBar"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="3.5" rx="1"/><rect x="3.5" y="10.5" width="17" height="9" rx="1"/></svg></span><span class="mi-label">Show bookmarks bar</span><span class="mi-shortcut" id="menuBarCheck"></span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="menuPerformance"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 13 7 13 10 5 14 19 17 11 21 11"/></svg></span><span class="mi-label">Performance</span></div>
    <div class="menu-item" id="menuAbout"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><line x1="12" y1="16" x2="12" y2="11"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></svg></span><span class="mi-label">About Daybreak</span></div>
  </div>

  <div id="tabContextMenu" class="floating-menu">
    <div class="menu-item" id="ctxReload"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><polyline points="20 4 20 9 15 9"/></svg></span><span class="mi-label">Reload</span></div>
    <div class="menu-item" id="ctxDuplicate"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="8" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg></span><span class="mi-label">Duplicate tab</span></div>
    <div class="menu-item" id="ctxPin"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="21.5"/><path d="M6 9a6 6 0 0 1 12 0c0 2.5-1.7 3.3-1.7 5H7.7C7.7 12.3 6 11.5 6 9z"/></svg></span><span class="mi-label">Pin tab</span></div>
    <div class="menu-item" id="ctxMute"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="10.5 5 6 8.5 3 8.5 3 15.5 6 15.5 10.5 19"/><line x1="15" y1="9" x2="20.5" y2="14.5"/><line x1="20.5" y1="9" x2="15" y2="14.5"/></svg></span><span class="mi-label">Mute tab</span></div>
    <div class="menu-divider"></div>
    <div class="menu-item" id="ctxCloseOthers"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="17" y1="7" x2="7" y2="17"/><line x1="7" y1="7" x2="17" y2="17"/></svg></span><span class="mi-label">Close other tabs</span></div>
    <div class="menu-item danger" id="ctxClose"><span class="mi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="17" y1="7" x2="7" y2="17"/><line x1="7" y1="7" x2="17" y2="17"/></svg></span><span class="mi-label">Close tab</span><span class="mi-shortcut">Ctrl+W</span></div>
  </div>

<script>
(function () {
  var state = { activeId: null, tabs: [], settings: {} };
  var editingUrl = false;
  var contextTabId = null;

  var tabstrip = document.getElementById('tabstrip');
  // A vertical scroll/wheel gesture doesn't natively scroll a horizontally
  // overflowing element — real browsers translate it for their tab strip,
  // so this does the same. Without this, tabs beyond the visible width
  // were reachable in the DOM but the user had no way to actually get to
  // them (no visible scrollbar, no drag-to-scroll).
  tabstrip.addEventListener('wheel', function (e) {
    if (e.deltaY === 0) return;
    tabstrip.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
  var urlbar = document.getElementById('urlbar');
  var backBtn = document.getElementById('backBtn');
  var fwdBtn = document.getElementById('fwdBtn');
  var reloadBtn = document.getElementById('reloadBtn');
  var newTabBtn = document.getElementById('newTabBtn');
  var starBtn = document.getElementById('starBtn');
  var menuBtn = document.getElementById('menuBtn');
  var menuDropdown = document.getElementById('menuDropdown');
  var tabContextMenu = document.getElementById('tabContextMenu');
  var bookmarksBar = document.getElementById('bookmarksBar');
  var minBtn = document.getElementById('minBtn');
  var maxBtn = document.getElementById('maxBtn');
  var closeWinBtn = document.getElementById('closeWinBtn');
  var tabRow = document.getElementById('tabRow');
  var loadBar = document.getElementById('loadBar');
  var logo = document.getElementById('logo');
  var findBar = document.getElementById('findBar');
  var findInput = document.getElementById('findInput');
  var findCount = document.getElementById('findCount');

  function activeTab() {
    return state.tabs.find(function (t) { return t.id === state.activeId; }) || null;
  }

  function hueFor(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return url || ''; }
  }

  function orderedTabs() {
    var pinned = state.tabs.filter(function (t) { return t.pinned; });
    var rest = state.tabs.filter(function (t) { return !t.pinned; });
    return pinned.concat(rest);
  }

  // Reused across renders so tabs are updated in place rather than torn down
  // and recreated — recreating them retriggered every tab's entrance
  // animation on every single state push (loading start/stop, title
  // updates, etc. all push state, which happens many times during one page
  // load), which is what looked like constant flashing.
  var tabElById = {};
  var tabSigById = {}; // last-rendered signature per tab, to skip no-op rebuilds
  var tabDrag = null; // { id, startX, startY, dragging, pinned, el }
  var suppressNextTabClick = false;
  var TAB_DRAG_THRESHOLD = 5;

  function ensureTabElement(tab) {
    var el = tabElById[tab.id];
    if (el) return el;
    el = document.createElement('div');
    el.dataset.tabId = tab.id;

    // Built once and reused for the tab's whole lifetime — updateTabElement
    // only ever mutates these afterward (text/class/style), never tears
    // down and rebuilds them, which is what was causing a visible flash on
    // every loading/title change (even a fast one).
    var mono = document.createElement('span');
    mono.className = 'tab-monogram';
    el.appendChild(mono);

    var favicon = document.createElement('img');
    favicon.className = 'tab-favicon';
    favicon.alt = '';
    // A favicon that fails to load (dead link, blocked host) should just
    // fall back to the monogram/blank state rather than showing a broken
    // image icon.
    favicon.addEventListener('error', function () {
      el.classList.remove('has-favicon');
      favicon.removeAttribute('src');
    });
    el.appendChild(favicon);

    var spinner = document.createElement('span');
    spinner.className = 'tab-spinner';
    el.appendChild(spinner);

    var titleEl = document.createElement('span');
    titleEl.className = 'tab-title';
    el.appendChild(titleEl);

    var muteEl = document.createElement('span');
    muteEl.className = 'tab-mute';
    muteEl.textContent = '\u266a'; // eighth note — a plain symbol, not an emoji glyph
    muteEl.addEventListener('click', function (e) {
      e.stopPropagation();
      window.api.toggleMuteTab(tab.id);
    });
    el.appendChild(muteEl);

    var closeEl = document.createElement('span');
    closeEl.className = 'tab-close';
    closeEl.textContent = '\u00d7';
    closeEl.addEventListener('click', function (e) {
      e.stopPropagation();
      window.api.closeTab(tab.id);
    });
    el.appendChild(closeEl);

    el._mono = mono;
    el._favicon = favicon;
    el._title = titleEl;

    el.addEventListener('click', function () {
      if (suppressNextTabClick) { suppressNextTabClick = false; return; }
      window.api.switchTab(tab.id);
    });
    el.addEventListener('mousedown', function (e) {
      if (e.button === 1) { e.preventDefault(); window.api.closeTab(tab.id); return; } // middle-click closes
      if (e.button !== 0) return;
      if (e.target.closest('.tab-close')) return;
      var current = state.tabs.find(function (t) { return t.id === tab.id; });
      if (!current) return;
      tabDrag = { id: tab.id, startX: e.clientX, startY: e.clientY, dragging: false, pinned: !!current.pinned, el: el };
    });
    el.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      // Look up the current tab fresh (not the possibly-stale snapshot this
      // closure was created with) so Pin/Unpin always reflects reality.
      var current = state.tabs.find(function (t) { return t.id === tab.id; }) || tab;
      openTabContextMenu(current, e.clientX, e.clientY);
    });
    tabElById[tab.id] = el;
    return el;
  }

  function updateTabElement(el, tab) {
    el.className = 'tab' +
      (tab.id === state.activeId ? ' active' : '') +
      (tab.pinned ? ' pinned' : '') +
      (tab.loading ? ' loading' : '') +
      (tab.discarded ? ' discarded' : '') +
      (tab.audible ? ' audible' : '') +
      (tab.muted ? ' muted' : '') +
      (tab.favicon ? ' has-favicon' : '');
    el.title = tab.url;

    if (tab.favicon && el._favicon.src !== tab.favicon) el._favicon.src = tab.favicon;
    if (!tab.favicon) el._favicon.removeAttribute('src');

    if (tab.pinned) {
      var host = hostOf(tab.url);
      el._mono.style.background = 'hsl(' + hueFor(host) + ',55%,45%)';
      el._mono.textContent = (host[0] || '?').toUpperCase();
    } else {
      el._title.textContent = tab.loading ? 'Loading\u2026' : (tab.title || 'New Tab');
    }
  }

  var lastScrolledActiveId = null;

  function renderTabs() {
    // Don't let a background state push (another tab's spinner, etc.) fight
    // the live drag-reorder preview below — it would snap the dragged tab
    // back to its pre-drag position mid-gesture. Normal rendering resumes
    // the instant the drag ends.
    if (tabDrag && tabDrag.dragging) return;

    var ordered = orderedTabs();
    var seen = {};
    ordered.forEach(function (tab) {
      seen[tab.id] = true;
      var el = ensureTabElement(tab);
      // Busy pages fire many state pushes in quick succession; a tab whose
      // own visible fields haven't actually changed shouldn't have its
      // content wiped and rebuilt just because SOME tab's state changed.
      var sig = [tab.id === state.activeId, tab.pinned, tab.loading, tab.title, tab.url, tab.discarded, tab.audible, tab.muted, tab.favicon].join('\u0001');
      if (tabSigById[tab.id] !== sig) {
        tabSigById[tab.id] = sig;
        updateTabElement(el, tab);
      }
      tabstrip.appendChild(el); // re-appending an already-attached node just reorders it, no re-animation
    });
    Object.keys(tabElById).forEach(function (id) {
      if (!seen[id]) { tabElById[id].remove(); delete tabElById[id]; delete tabSigById[id]; }
    });

    // The tab strip scrolls once there isn't room for every tab (see the
    // wheel handler below) — but a newly created or newly switched-to tab
    // needs to actually be visible without the user first discovering they
    // have to scroll to find it. Only do this on an actual active-tab
    // change, not every render, so it doesn't fight someone deliberately
    // scrolling to glance at a background tab.
    if (state.activeId && state.activeId !== lastScrolledActiveId) {
      lastScrolledActiveId = state.activeId;
      var activeEl = tabElById[state.activeId];
      if (activeEl) {
        var stripRect = tabstrip.getBoundingClientRect();
        var elRect = activeEl.getBoundingClientRect();
        if (elRect.left < stripRect.left) {
          tabstrip.scrollLeft -= (stripRect.left - elRect.left) + 8;
        } else if (elRect.right > stripRect.right) {
          tabstrip.scrollLeft += (elRect.right - stripRect.right) + 8;
        }
      }
    }
  }

  // ---- tab drag-to-reorder ----
  // Pinned and unpinned tabs stay in their own groups (matches how they're
  // displayed) — a tab can only be reordered among others of the same kind.
  document.addEventListener('mousemove', function (e) {
    if (!tabDrag) return;
    var dx = e.clientX - tabDrag.startX, dy = e.clientY - tabDrag.startY;
    if (!tabDrag.dragging) {
      if (Math.abs(dx) < TAB_DRAG_THRESHOLD && Math.abs(dy) < TAB_DRAG_THRESHOLD) return;
      tabDrag.dragging = true;
      tabDrag.el.classList.add('tab-dragging');
    }
    var overEl = document.elementFromPoint(e.clientX, e.clientY);
    var overTab = overEl ? overEl.closest('.tab') : null;
    if (!overTab || overTab === tabDrag.el) return;
    if (overTab.classList.contains('pinned') !== tabDrag.pinned) return; // don't cross the pinned/unpinned boundary
    var rect = overTab.getBoundingClientRect();
    var placeBefore = e.clientX < rect.left + rect.width / 2;
    tabstrip.insertBefore(tabDrag.el, placeBefore ? overTab : overTab.nextSibling);
  });

  document.addEventListener('mouseup', function () {
    if (!tabDrag) return;
    if (tabDrag.dragging) {
      tabDrag.el.classList.remove('tab-dragging');
      suppressNextTabClick = true;
      var orderedIds = Array.prototype.map.call(tabstrip.children, function (child) { return child.dataset.tabId; });
      window.api.reorderTabs(orderedIds);
    }
    tabDrag = null;
  });

  function renderToolbarState() {
    var active = activeTab();
    if (active) {
      if (!editingUrl) urlbar.value = active.url === 'daybreak://newtab' ? '' : active.url;
      backBtn.disabled = !active.canGoBack;
      fwdBtn.disabled = !active.canGoForward;
      starBtn.classList.toggle('active', !!active.bookmarked);
      loadBar.classList.toggle('active', !!active.loading);
      logo.classList.toggle('spin', !!active.loading);
    } else {
      if (!editingUrl) urlbar.value = '';
      backBtn.disabled = true;
      fwdBtn.disabled = true;
      starBtn.classList.remove('active');
      loadBar.classList.remove('active');
      logo.classList.remove('spin');
    }
  }

  function renderBookmarksBarVisibility() {
    var show = !!(state.settings && state.settings.showBookmarksBar);
    bookmarksBar.classList.toggle('show', show);
    document.getElementById('menuBarCheck').textContent = show ? '\u2713' : '';
  }

  var lastBookmarksSignature = null;
  function refreshBookmarksBar() {
    var list = state.bookmarks || [];
    var signature = list.map(function (b) { return b.id; }).join(',');
    if (signature === lastBookmarksSignature) return; // nothing actually changed — don't touch the DOM
    lastBookmarksSignature = signature;

    bookmarksBar.innerHTML = '';
    if (!list.length) {
      var empty = document.createElement('span');
      empty.className = 'bm-empty';
      empty.textContent = 'Bookmarks you save will appear here';
      bookmarksBar.appendChild(empty);
      return;
    }
    list.forEach(function (b) {
      var chip = document.createElement('div');
      chip.className = 'bm-chip';
      chip.title = b.url;
      chip.addEventListener('click', function () {
        if (state.activeId) window.api.navigate(state.activeId, b.url);
      });

      if (b.favicon) {
        var icon = document.createElement('img');
        icon.className = 'bm-chip-icon';
        icon.src = b.favicon;
        icon.alt = '';
        icon.addEventListener('error', function () { icon.remove(); });
        chip.appendChild(icon);
      }

      var label = document.createElement('span');
      label.textContent = b.title || b.url;
      chip.appendChild(label);

      bookmarksBar.appendChild(chip);
    });
  }

  function applyTheme() {
    document.body.classList.toggle('dark', !!(state.settings && state.settings.theme === 'dark'));
  }

  function render() {
    applyTheme();
    renderTabs();
    renderToolbarState();
    renderBookmarksBarVisibility();
    refreshBookmarksBar();
  }

  window.api.onUpdate(function (newState) { state = newState; render(); });
  window.api.onWinState(function (winState) {
    maxBtn.innerHTML = winState.maximized ? '&#10064;' : '&#9723;';
    maxBtn.title = winState.maximized ? 'Restore' : 'Maximize';
  });
  window.api.onFocusUrlbar(function () { urlbar.focus(); urlbar.select(); });
  window.api.onBookmarkToggleRequest(function () { starBtn.click(); });

  // ---- tab actions ----
  newTabBtn.addEventListener('click', function () { window.api.createTab(); });
  backBtn.addEventListener('click', function () { if (state.activeId) window.api.goBack(state.activeId); });
  fwdBtn.addEventListener('click', function () { if (state.activeId) window.api.goForward(state.activeId); });
  reloadBtn.addEventListener('click', function () { if (state.activeId) window.api.reload(state.activeId); });

  starBtn.addEventListener('click', function () {
    var active = activeTab();
    if (!active) return;
    if (active.bookmarked) window.api.removeBookmarkByUrl(active.url);
    else window.api.addBookmark(active.url, active.title, active.favicon);
  });

  urlbar.addEventListener('focus', function () { editingUrl = true; });
  urlbar.addEventListener('blur', function () { editingUrl = false; renderToolbarState(); });
  urlbar.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      if (state.activeId) window.api.navigate(state.activeId, urlbar.value);
      urlbar.blur();
    } else if (e.key === 'Escape') {
      urlbar.blur();
    }
  });

  // ---- window controls ----
  minBtn.addEventListener('click', function () { window.api.minimizeWindow(); });
  maxBtn.addEventListener('click', function () { window.api.maximizeWindow(); });
  closeWinBtn.addEventListener('click', function () { window.api.closeWindow(); });

  // ---- floating menu helpers ----
  // The overlay only covers the toolbar strip (see main.js), so opening any
  // floating UI below that edge needs to temporarily grow the overlay's
  // bounds first, or it gets clipped.
  function shrinkOverlayIfIdle() {
    if (!anyMenuOpen() && !findBar.classList.contains('show')) window.api.setOverlayExtra(0);
  }
  function closeAllMenus() {
    menuDropdown.classList.remove('show');
    tabContextMenu.classList.remove('show');
    shrinkOverlayIfIdle();
  }
  function anyMenuOpen() {
    return menuDropdown.classList.contains('show') || tabContextMenu.classList.contains('show');
  }

  // Reserve exactly as much extra overlay height as the floating element
  // actually needs (measured, not guessed) — a hardcoded number silently
  // drifts out of date the next time items are added to the menu, which is
  // exactly what clipped/blocked it before.
  function growToFit(el) {
    var rect = el.getBoundingClientRect();
    window.api.setOverlayExtra(Math.ceil(rect.bottom) + 12);
  }

  function openMenu() {
    closeAllMenus();
    var rect = menuBtn.getBoundingClientRect();
    menuDropdown.style.top = (rect.bottom + 4) + 'px';
    menuDropdown.style.right = '8px';
    menuDropdown.style.left = '';
    menuDropdown.classList.add('show');
    growToFit(menuDropdown);
  }

  function openTabContextMenu(tab, x, y) {
    closeAllMenus();
    contextTabId = tab.id;
    document.getElementById('ctxPin').querySelector('.mi-label').textContent = tab.pinned ? 'Unpin tab' : 'Pin tab';
    document.getElementById('ctxMute').querySelector('.mi-label').textContent = tab.muted ? 'Unmute tab' : 'Mute tab';
    tabContextMenu.style.top = (y + 2) + 'px';
    tabContextMenu.style.left = x + 'px';
    tabContextMenu.style.right = '';
    tabContextMenu.classList.add('show');
    growToFit(tabContextMenu);
  }

  menuBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (menuDropdown.classList.contains('show')) closeAllMenus(); else openMenu();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.floating-menu') && !e.target.closest('#menuBtn')) closeAllMenus();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeAllMenus(); closeFindBar(); }
  });

  // ---- main menu items (internal pages open as NEW TABS, never replace the current page) ----
  document.getElementById('menuNewTab').addEventListener('click', function () { window.api.createTab(); closeAllMenus(); });
  document.getElementById('menuBookmarks').addEventListener('click', function () { window.api.createTab('daybreak://bookmarks'); closeAllMenus(); });
  document.getElementById('menuHistory').addEventListener('click', function () { window.api.createTab('daybreak://history'); closeAllMenus(); });
  document.getElementById('menuDownloads').addEventListener('click', function () { window.api.createTab('daybreak://downloads'); closeAllMenus(); });
  document.getElementById('menuApps').addEventListener('click', function () { window.api.createTab('daybreak://apps'); closeAllMenus(); });
  document.getElementById('menuPerformance').addEventListener('click', function () { window.api.createTab('daybreak://performance'); closeAllMenus(); });
  document.getElementById('menuReopen').addEventListener('click', function () { window.api.reopenClosedTab(); closeAllMenus(); });
  document.getElementById('menuSettings').addEventListener('click', function () { window.api.createTab('daybreak://settings'); closeAllMenus(); });
  document.getElementById('menuAbout').addEventListener('click', function () { window.api.createTab('daybreak://about'); closeAllMenus(); });
  document.getElementById('menuFind').addEventListener('click', function () { openFindBar(); closeAllMenus(); });
  document.getElementById('menuViewSource').addEventListener('click', function () { if (state.activeId) window.api.viewSource(state.activeId); closeAllMenus(); });
  document.getElementById('menuZoomIn').addEventListener('click', function () { if (state.activeId) window.api.zoomIn(state.activeId); closeAllMenus(); });
  document.getElementById('menuZoomOut').addEventListener('click', function () { if (state.activeId) window.api.zoomOut(state.activeId); closeAllMenus(); });
  document.getElementById('menuZoomReset').addEventListener('click', function () { if (state.activeId) window.api.zoomReset(state.activeId); closeAllMenus(); });
  document.getElementById('menuToggleBar').addEventListener('click', function () {
    var current = !!(state.settings && state.settings.showBookmarksBar);
    window.api.setSettings({ showBookmarksBar: !current });
    closeAllMenus();
  });

  // ---- tab context menu items ----
  document.getElementById('ctxReload').addEventListener('click', function () { if (contextTabId) window.api.reload(contextTabId); closeAllMenus(); });
  document.getElementById('ctxDuplicate').addEventListener('click', function () { if (contextTabId) window.api.duplicateTab(contextTabId); closeAllMenus(); });
  document.getElementById('ctxPin').addEventListener('click', function () { if (contextTabId) window.api.togglePinTab(contextTabId); closeAllMenus(); });
  document.getElementById('ctxMute').addEventListener('click', function () { if (contextTabId) window.api.toggleMuteTab(contextTabId); closeAllMenus(); });
  document.getElementById('ctxCloseOthers').addEventListener('click', function () { if (contextTabId) window.api.closeOtherTabs(contextTabId); closeAllMenus(); });
  document.getElementById('ctxClose').addEventListener('click', function () { if (contextTabId) window.api.closeTab(contextTabId); closeAllMenus(); });

  // ---- find in page ----
  var lastFindQuery = '';
  var findDebounce = null;

  function doFind(forward) {
    var q = findInput.value;
    if (!q || !state.activeId) return;
    if (q !== lastFindQuery) {
      lastFindQuery = q;
      window.api.findStart(state.activeId, q, forward);
    } else {
      window.api.findNext(state.activeId, q, forward);
    }
  }

  function openFindBar() {
    findBar.classList.add('show');
    findInput.focus();
    findInput.select();
    growToFit(findBar);
  }
  function closeFindBar() {
    if (!findBar.classList.contains('show')) return;
    findBar.classList.remove('show');
    findCount.textContent = '';
    lastFindQuery = '';
    if (findDebounce) { clearTimeout(findDebounce); findDebounce = null; }
    if (state.activeId) window.api.findStop(state.activeId);
    shrinkOverlayIfIdle();
  }
  window.api.onFindOpen(openFindBar);
  window.api.onFindResult(function (r) {
    if (!r || !r.tabId || r.tabId !== state.activeId) return;
    findCount.textContent = r.matches ? (r.activeMatch + ' of ' + r.matches) : 'No results';
  });
  findInput.addEventListener('input', function () {
    if (findDebounce) clearTimeout(findDebounce);
    if (!findInput.value) {
      lastFindQuery = '';
      findCount.textContent = '';
      if (state.activeId) window.api.findStop(state.activeId);
      return;
    }
    // Search live as you type, lightly debounced so fast typing doesn't
    // fire a findInPage call on every single keystroke.
    findDebounce = setTimeout(function () {
      lastFindQuery = findInput.value; // a fresh query always restarts, never "advances"
      if (state.activeId) window.api.findStart(state.activeId, findInput.value, true);
    }, 120);
  });
  findInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      if (findDebounce) { clearTimeout(findDebounce); findDebounce = null; }
      doFind(!e.shiftKey);
    } else if (e.key === 'Escape') {
      closeFindBar();
    }
  });
  document.getElementById('findPrev').addEventListener('click', function () { doFind(false); });
  document.getElementById('findNext').addEventListener('click', function () { doFind(true); });
  document.getElementById('findClose').addEventListener('click', closeFindBar);

  // ---- manual window drag (tab row) ----
  // This only needs mousedown/mousemove within the toolbar's own bounds, so
  // — unlike resize — it works fine without the overlay covering the full
  // window.
  var dragStartMouse = null, dragStartWin = null;
  tabRow.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    if (e.target.closest('.tab, button')) return;
    dragStartMouse = { x: e.screenX, y: e.screenY };
    window.api.windowDragStart();
    window.api.getWindowPosition().then(function (pos) { dragStartWin = pos; });
  });
  tabRow.addEventListener('dblclick', function (e) {
    if (e.target.closest('.tab, button')) return;
    window.api.maximizeWindow();
  });

  var pendingFrame = null;
  document.addEventListener('mousemove', function (e) {
    if (!dragStartMouse || !dragStartWin) return;
    var dx = e.screenX - dragStartMouse.x, dy = e.screenY - dragStartMouse.y;
    if (pendingFrame) cancelAnimationFrame(pendingFrame);
    pendingFrame = requestAnimationFrame(function () {
      window.api.setWindowPosition(dragStartWin[0] + dx, dragStartWin[1] + dy);
    });
  });
  document.addEventListener('mouseup', function () {
    if (dragStartMouse) window.api.windowDragEnd();
    dragStartMouse = null; dragStartWin = null;
  });
})();
</script>
</body>
</html>
